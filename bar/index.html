<style>

<button id="exitbar" aria-label="Salir">✕</button><div id="intro"><div class="bg"></div><div class="t"></div><div class="b"><p>Un rincón hecho para ti.<br>Pasa, escoge tu vaso y prepara tu momento.</p><button id="enter">Entrar</button><span class="hint2">TOCA PARA ABRIR LA PUERTA</span></div></div>

</div>

<script>
// Bar sound engine: everything is synthesized with Web Audio (no files, no copyright, no cost).
class BarAudio {
  constructor() { this.ctx = null; this.genre = 'jazz'; this.on = true; this.step = 0; this.nextT = 0; this.timer = null; this.ambOn = false; }
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const ctx = this.ctx = new C();
    this.master = ctx.createGain(); this.master.gain.value = this.on ? 0.9 : 0; this.master.connect(ctx.destination);
    this.musicBus = ctx.createGain(); this.musicBus.gain.value = 0.5; this.sfxBus = ctx.createGain(); this.sfxBus.gain.value = 0.9; this.ambBus = ctx.createGain(); this.ambBus.gain.value = 0.7;
    // reverb (generated impulse)
    const len = ctx.sampleRate * 2.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    this.rev = ctx.createConvolver(); this.rev.buffer = ir; const rg = ctx.createGain(); rg.gain.value = 0.35; this.rev.connect(rg); rg.connect(this.master);
    [this.musicBus, this.sfxBus].forEach(b => { b.connect(this.master); const s = ctx.createGain(); s.gain.value = 0.45; b.connect(s); s.connect(this.rev); });
    this.ambBus.connect(this.master);
    // noise buffer
    const nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1; this.noiseBuf = nb;
    this.startAmbience(); this.startMusic();
  }
  setOn(v) { this.on = v; if (this.master) this.master.gain.setTargetAtTime(v ? 0.9 : 0, this.ctx.currentTime, 0.1); }
  setGenre(g) { this.genre = g; this.step = 0; if (this.ctx) this.nextT = this.ctx.currentTime + 0.1; if (g === 'off') this.musicBus && this.musicBus.gain.setTargetAtTime(0, this.ctx.currentTime, 0.2); else this.musicBus && this.musicBus.gain.setTargetAtTime(0.5, this.ctx.currentTime, 0.4); }
  noise(dur, type, f0, f1, g, bus) {
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(f0, t); f.frequency.linearRampToValueAtTime(f1, t + dur); f.Q.value = 0.9;
    const a = c.createGain(); a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(g, t + 0.08); a.gain.setValueAtTime(g, t + dur - 0.2); a.gain.linearRampToValueAtTime(0, t + dur);
    s.connect(f); f.connect(a); a.connect(bus || this.sfxBus); s.start(t); s.stop(t + dur + 0.05);
  }
  tone(freq, t, dur, type, g, bus, glide) {
    const c = this.ctx, o = c.createOscillator(), a = c.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t); if (glide) o.frequency.exponentialRampToValueAtTime(glide, t + dur);
    a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(g, t + 0.01); a.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(a); a.connect(bus || this.sfxBus); o.start(t); o.stop(t + dur + 0.05);
  }
  // ---- sound effects ----
  sfx(name) {
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime;
    if (name === 'click') this.tone(900, t, 0.08, 'sine', 0.2);
    if (name === 'pour') { this.noise(1.1, 'bandpass', 1500, 2400, 0.35); this.tone(300, t, 1, 'sine', 0.04, null, 520); }
    if (name === 'pourThick') { this.noise(1.2, 'bandpass', 700, 1200, 0.4); }
    if (name === 'espresso') { this.noise(2.3, 'lowpass', 900, 500, 0.45); this.tone(58, t, 2.2, 'sawtooth', 0.12); this.noise(0.5, 'highpass', 5000, 6000, 0.25); }
    if (name === 'ice') { for (let i = 0; i < 4; i++) { const tt = t + i * 0.09 + Math.random() * 0.04; this.tone(2200 + Math.random() * 2200, tt, 0.18, 'sine', 0.22); this.tone(5200 + Math.random() * 1800, tt, 0.06, 'triangle', 0.1); } }
    if (name === 'blender') { this.noise(2.8, 'bandpass', 600, 1400, 0.3); this.tone(150, t, 2.8, 'sawtooth', 0.12, null, 330); this.tone(75, t, 2.8, 'square', 0.05, null, 160); }
    if (name === 'drop') { this.tone(380, t, 0.25, 'sine', 0.3, null, 140); }
    if (name === 'sparkle') { [0, 1, 2, 3].forEach(i => this.tone(1400 * Math.pow(1.26, i), t + i * 0.07, 0.4, 'sine', 0.12)); }
    if (name === 'done') { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, t + i * 0.11, 0.7, 'triangle', 0.16)); }
    if (name === 'clink') { this.tone(3100, t, 0.5, 'sine', 0.2); this.tone(4700, t, 0.3, 'sine', 0.1); }
  }
  // ---- ambience: soft murmur + room tone + occasional cup clinks ----
  startAmbience() {
    const c = this.ctx; if (this.ambOn) return; this.ambOn = true;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 520; f.Q.value = 0.6;
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 0.17; lg.gain.value = 140; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    const g = c.createGain(); g.gain.value = 0.055; s.connect(f); f.connect(g); g.connect(this.ambBus); s.start();
    const loop = () => { if (!this.ctx) return; if (this.on) { const r = Math.random(); if (r < .5) this.tone(2800 + Math.random() * 1800, c.currentTime, 0.35, 'sine', 0.035, this.ambBus); else if (r < .7) this.noise(0.5, 'bandpass', 900, 700, 0.05, this.ambBus); } setTimeout(loop, 2500 + Math.random() * 6000); };
    setTimeout(loop, 3000);
  }
  // ---- music: four small generative styles ----
  startMusic() { this.nextT = this.ctx.currentTime + 0.2; this.timer = setInterval(() => this.sched(), 120); }
  sched() {
    if (!this.ctx || this.genre === 'off') return;
    const c = this.ctx; while (this.nextT < c.currentTime + 0.35) { this.note(this.step, this.nextT); const dt = this.dur(); this.nextT += dt; this.step++; }
  }

 for(const t of (st.tops2||[])){if(t.kind==='dust'){let seed=t.color.charCodeAt(2)*97;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};g.fillStyle=t.color;for(let q=0;q<90;q++){const r=1.4*sc*2.2*(.5+rnd());g.beginPath();g.arc(cx+(rnd()-.5)*bw*.78,y-rnd()*10*sc*1.6,r,0,6.3);g.fill()}y-=6*sc;continue}
  const img=await loadImg(t.kind==='cream'?creamImg():scoopImg(t.color));const w=Math.min(bw*.55,height*.2);const hh=w*(70/64);if(img)g.drawImage(img,cx-w/2,y-hh,w,hh);y-=w*.5}
 return out}
async function makeCard(st,name){const W=1080,H=1350;const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
 // warm bar backdrop: the cafe photo, softened by down/up-scaling (works on every phone)
 const bg=await loadImg('cafe.jpg');const sm=document.createElement('canvas');sm.width=48;sm.height=60;if(bg)sm.getContext('2d').drawImage(bg,0,300,1024,1236,0,0,48,60);g.imageSmoothingEnabled=true;g.drawImage(sm,0,0,W,H);
 const vg=g.createRadialGradient(W/2,H*.5,100,W/2,H*.5,H*.75);vg.addColorStop(0,'rgba(20,14,8,.15)');vg.addColorStop(1,'rgba(14,10,6,.78)');g.fillStyle=vg;g.fillRect(0,0,W,H);
 g.strokeStyle='rgba(233,201,122,.75)';g.lineWidth=3;g.strokeRect(34,34,W-68,H-68);g.lineWidth=1;g.strokeRect(46,46,W-92,H-92);
 g.textAlign='center';g.fillStyle='#E9C97A';g.font='600 30px Georgia,serif';if('letterSpacing' in g)g.letterSpacing='9px';g.fillText('CÓDIGO MUJER LIBRE',W/2,120);
 g.font='italic 26px Georgia,serif';if('letterSpacing' in g)g.letterSpacing='3px';g.fillStyle='#F3E4BF';g.fillText(T('Bar de Matcha & Café'),W/2,164);
 // shelf + shadow + cup
 const cup=await cupCanvas(st,CUPS[st.cup].lid?760:740);const baseY=H-400;
 const gl=g.createRadialGradient(W/2,baseY-cup.height*.45,20,W/2,baseY-cup.height*.45,520);gl.addColorStop(0,'rgba(255,214,140,.38)');gl.addColorStop(1,'rgba(255,214,140,0)');g.fillStyle=gl;g.fillRect(0,0,W,H);
 const sh=g.createRadialGradient(W/2,baseY+10,10,W/2,baseY+10,cup.width*.7);sh.addColorStop(0,'rgba(0,0,0,.55)');sh.addColorStop(1,'rgba(0,0,0,0)');g.save();g.translate(0,baseY);g.scale(1,.18);g.translate(0,-baseY);g.fillStyle=sh;g.fillRect(0,baseY-200,W,500);g.restore();
 const mg=g.createLinearGradient(0,baseY,0,H-60);mg.addColorStop(0,'rgba(245,238,226,.85)');mg.addColorStop(1,'rgba(210,198,176,.55)');g.fillStyle=mg;g.fillRect(60,baseY,W-120,H-60-baseY-120);
 g.drawImage(cup,W/2-cup.width/2,baseY-cup.height+14);
 // text
 g.fillStyle='#2f2a20';g.font='500 70px Georgia,serif';if('letterSpacing' in g)g.letterSpacing='1px';let nm=(name||T('Mi creación'));while(g.measureText(nm).width>W-200&&nm.length>6)nm=nm.slice(0,-1);g.fillText(nm,W/2,baseY+100);
 g.fillStyle='#8a7440';g.font='italic 30px Georgia,serif';g.fillText(T('Preparada en el vaso ')+CUPS[st.cup].n[0]+CUPS[st.cup].n.slice(1).toLowerCase(),W/2,baseY+148);
 const names=[...new Set(st.layers.map(l=>TN(l.name)).concat((st.tops2||[]).map(t=>T(t.kind==='cream'?'Crema batida':t.kind==='dust'?(t.name||'Topping'):(t.name||'Helado')))))];
 g.fillStyle='#5b5340';g.font='26px system-ui,sans-serif';if('letterSpacing' in g)g.letterSpacing='0px';const words=names.join(' · ').split(' ');const lines=[];let cur='';words.forEach(w=>{const t=cur?cur+' '+w:w;if(g.measureText(t).width>W-200&&cur){lines.push(cur);cur=w}else cur=t});lines.push(cur);lines.slice(0,3).forEach((l,i)=>g.fillText(l,W/2,baseY+196+i*34));
 g.fillStyle='#8a7440';g.font='600 22px system-ui,sans-serif';if('letterSpacing' in g)g.letterSpacing='7px';g.fillText('♡  CÓDIGO MUJER LIBRE  ♡',W/2,H-92);
 return cv}

const RKEY='cml_bar_recipes',MAXR=5,DAYS=90;
function loadRec(){let a=[];try{a=JSON.parse(localStorage.getItem(RKEY)||'[]')}catch{}const now=Date.now();const keep=a.filter(r=>now-(r.last||r.date)<DAYS*864e5);if(keep.length!==a.length)saveRec(keep);return keep}

 box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const a2=loadRec();a2.splice(+b.dataset.d,1);saveRec(a2);renderRecipes()});
