 show(cur,true);
}
function show(i,keep){
 cur=Math.max(0,Math.min(S.length-1,i));
 [...stage.children].forEach((d,k)=>d.classList.toggle("on",k===cur));
 [...bars.children].forEach((b,k)=>{b.className=k<cur?"done":k===cur?"cur":"";});
 bars.style.setProperty("--dur",DUR+"ms");bars.classList.toggle("paused",!started||!auto||cur===S.length-1);
 const cb=bars.children[cur];if(cb){cb.style.animation="none";void cb.offsetWidth;cb.style.animation="";}
 document.getElementById("prev").disabled=cur===0;document.getElementById("next").disabled=cur===S.length-1;
 const nx=S[cur+1];if(nx){const u=pick(nx.img);if(typeof u==="string"){const im=new Image();im.src=u;}}
 clearTimeout(timer);if(started&&auto&&cur<S.length-1)timer=setTimeout(()=>show(cur+1),DUR);
}
const go=d=>{show(cur+d)};
document.getElementById("prev").onclick=document.getElementById("zl").onclick=()=>go(-1);
document.getElementById("next").onclick=document.getElementById("zr").onclick=()=>go(1);
document.getElementById("auto").onclick=()=>{auto=!auto;document.getElementById("auto").setAttribute("aria-pressed",auto);document.getElementById("auto").textContent=(auto?"❚❚ ":"▶ ")+"Auto";show(cur)};
document.getElementById("lang").onclick=()=>{lang=lang==="es"?"en":"es";try{localStorage.setItem("cml_demo_lang",lang)}catch(e){}build()};
addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();go(1)}else if(e.key==="ArrowLeft")go(-1);else if(e.key==="Home")show(0);else if(e.key==="End")show(S.length-1)});
let tx=0;addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(d<0?1:-1)},{passive:true});
const mus=document.getElementById("mus"),st=document.getElementById("start"),T2={es:{h:"Conoce <em>Código Mujer Libre</em>",p:"Un recorrido por el hotel virtual hecho para mujeres. Mejor con sonido.",b:"▶ Ver el demo"},en:{h:"Discover <em>Código Mujer Libre</em>",p:"A tour of the virtual hotel made for women. Best with sound.",b:"▶ Watch the demo"}};
function paintStart(){const c=T2[lang];document.getElementById("sh").innerHTML=c.h;document.getElementById("sp").textContent=c.p;document.getElementById("go").textContent=c.b;st.querySelectorAll("[data-l]").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));document.documentElement.lang=lang}
st.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("cml_demo_lang",lang)}catch(e){}paintStart();build()});
let snd=true;function ramp(a,max,step){a.volume=0;a.play().then(()=>{let v=0;const iv=setInterval(()=>{v=Math.min(max,v+step);a.volume=v;if(v>=max)clearInterval(iv)},200)}).catch(()=>{})}
function fadeIn(){ramp(mus,.12,.003)}
function begin(){if(started)return;started=true;st.classList.add("out");if(snd&&!film)fadeIn();show(0)}
document.getElementById("go").onclick=begin;
document.getElementById("snd").onclick=e=>{snd=!snd;e.currentTarget.setAttribute("aria-pressed",snd);e.currentTarget.style.opacity=snd?1:.5;if(snd)mus.play().catch(()=>{});else mus.pause()};
paintStart();build();
if(film){st.remove();started=true;show(0)}
})();
</script>
