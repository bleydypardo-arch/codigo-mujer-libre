<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5FC2E6"/><stop offset=".38" stop-color="#A9E0EC"/><stop offset=".62" stop-color="#FFE6BD"/><stop offset=".85" stop-color="#FFC59A"/><stop offset="1" stop-color="#FFAE86"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB98F"/><stop offset=".1" stop-color="#7ED3CE"/><stop offset=".45" stop-color="#25AFB8"/><stop offset="1" stop-color="#0A7E92"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#FFF6D6" stop-opacity="1"/><stop offset=".25" stop-color="#FFE4A8" stop-opacity=".75"/><stop offset="1" stop-color="#FFC58C" stop-opacity="0"/></radialGradient>
<filter id="bl" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<style>
.sun{transform-box:fill-box;transform-origin:center;animation:sunb 7s ease-in-out infinite alternate}
@keyframes sunb{to{transform:scale(1.07)}}
.cl{animation:drift 70s linear infinite alternate}
.cl.b{animation-duration:95s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(90px)}}
.gl{transform-box:fill-box;transform-origin:center;animation:gl 2.6s ease-in-out infinite}
@keyframes gl{0%,100%{transform:scaleX(.55);opacity:.35}50%{transform:scaleX(1.12);opacity:.95}}
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0}50%{opacity:.95}}
.wv{animation:wv linear infinite}
@keyframes wv{to{transform:translateX(var(--sh))}}
.bob{animation:bob ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(7px)}}
.boat{animation:boat 80s linear infinite}
@keyframes boat{from{transform:translateX(260px)}to{transform:translateX(-480px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
