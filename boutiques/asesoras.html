<body class="as">
<section id="login" hidden>
  <div class="lgsilk" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="lgbox">
    <p class="lgk">Código Mujer Libre</p>
    <h1>Asesoras</h1>
    <button id="orq" class="orq" type="button" aria-label="Toca la flor para abrirla">
      <svg viewBox="0 0 400 400" role="img" aria-hidden="true">
        <defs>
          <linearGradient id="gs" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8b1260"/><stop offset=".55" stop-color="#d8408f"/><stop offset="1" stop-color="#f58fc0"/></linearGradient>
          <linearGradient id="gp" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#a3166f"/><stop offset=".6" stop-color="#e2569e"/><stop offset="1" stop-color="#ffb2d6"/></linearGradient>
          <radialGradient id="gl" cx=".5" cy=".35" r=".8"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".45" stop-color="#e29a2e"/><stop offset="1" stop-color="#7a0f48"/></radialGradient>
          <radialGradient id="gh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd98a" stop-opacity=".85"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
        </defs>
        <circle class="halo" cx="200" cy="190" r="190" fill="url(#gh)"/>
        <path class="stem" d="M200 300 C196 340 204 370 200 400" stroke="#4f7a3a" stroke-width="7" fill="none" stroke-linecap="round"/>
        <g transform="rotate(128 200 190)"><g class="p" style="--c:40deg;--d:.12s"><path d="M200 190 C150 120 150 40 200 14 C250 40 250 120 200 190Z" fill="url(#gs)"/></g></g>
        <g transform="rotate(-128 200 190)"><g class="p" style="--c:-40deg;--d:.12s"><path d="M200 190 C150 120 150 40 200 14 C250 40 250 120 200 190Z" fill="url(#gs)"/></g></g>
        <g class="p" style="--c:-25deg;--d:.05s"><path d="M200 190 C150 175 62 160 44 104 C62 36 168 44 200 190Z" fill="url(#gp)"/><path d="M200 190 C140 150 80 100 62 96" stroke="#fff" stroke-opacity=".25" stroke-width="2" fill="none"/></g>
        <g class="p" style="--c:25deg;--d:.05s"><path d="M200 190 C250 175 338 160 356 104 C338 36 232 44 200 190Z" fill="url(#gp)"/><path d="M200 190 C260 150 320 100 338 96" stroke="#fff" stroke-opacity=".25" stroke-width="2" fill="none"/></g>
        <g class="p" style="--c:0deg;--d:0s"><path d="M200 190 C152 124 152 44 200 18 C248 44 248 124 200 190Z" fill="url(#gs)"/><path d="M200 170 L200 40" stroke="#fff" stroke-opacity=".3" stroke-width="2"/></g>
        <g class="p" style="--c:0deg;--d:.2s"><path d="M200 190 C168 202 148 252 172 284 C188 302 212 302 228 284 C252 252 232 202 200 190Z" fill="#a0155f"/><path d="M200 200 C184 214 178 250 190 272 C196 282 204 282 210 272 C222 250 216 214 200 200Z" fill="url(#gl)"/><circle cx="192" cy="250" r="2.4" fill="#7a0f48"/><circle cx="208" cy="250" r="2.4" fill="#7a0f48"/><circle cx="200" cy="262" r="2.4" fill="#7a0f48"/></g>
        <circle class="col" cx="200" cy="190" r="11" fill="#f6d27a" stroke="#c5a46a" stroke-width="2"/>
      </svg>
      <span class="orh">Toca la flor</span>
    </button>
    <div id="lgPad" class="lgpad">
      <p class="lgask">Escribe tu código de asesora</p>
      <div id="lgDots" class="lgdots" aria-live="polite"><i></i><i></i><i></i><i></i></div>
      <div class="keys">
        <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
        <button type="button" data-k="b" class="sm" aria-label="Borrar">⌫</button><button type="button" data-k="0">0</button><button type="button" data-k="e" class="sm go" aria-label="Entrar">✓</button>
      </div>
      <p id="lgErr" class="err" role="alert"></p>
      <button id="lgInst" type="button" class="lginst">📲 Instalar app</button>
    </div>
  </div>
</section>
<div id="app" hidden>
  <header class="top"><img src="../logo-marca.webp" alt="" width="34" height="34"><b>Código ML <em>Asesoras</em></b><button id="hInst" type="button" class="hb">Instalar</button><button id="hAcc" type="button" class="hb who" aria-label="Mi cuenta"><span id="who"></span> 👤</button></header>
  <main id="main"></main>
  <nav id="nav" aria-label="Menú principal">
    <button type="button" data-go="inicio"><i>🏠</i>Inicio</button>
    <button type="button" data-go="agenda"><i>📅</i>Agenda</button>
    <button type="button" data-go="academia"><i>🌸</i>Speeches</button>
    <button type="button" data-go="gastos"><i>🧾</i>Dinero</button>
    <button type="button" data-go="url:ventas.html"><i>🚪</i>Sala</button>
  </nav>
</div>
